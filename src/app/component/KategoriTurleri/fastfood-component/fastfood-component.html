<div class="menu-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar">
    <ul>
      <li><button [routerLink]="['/categories/sweets']" class="sidebar-btn">Sweets</button></li>
      <li><button [routerLink]="['/categories/fastfoods']" class="sidebar-btn active">Fastfood</button></li>
      <li><button class="sidebar-btn">Drinks</button></li>
      <li><button class="sidebar-btn">Breakfasts</button></li>

    </ul>
  </aside>

  <!-- Main Content -->
  <main class="menu-content">
    <div class="category-title">
      <h2>FastFoods</h2>
    </div>

    <div class="products-grid">

  <div class="product-card" *ngFor="let product of products" (click)="openModal(product)">
        <h3 class="product-title">{{ product.title }}</h3>
        <p class="product-description">{{ product.description }}</p>
        <div class="product-footer">
          <span class="product-price">{{ product.price }}</span>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal" *ngIf="selectedProduct">
  <div class="modal-content">
    <span class="close" (click)="closeModal()">&times;</span>
    <img [src]="selectedProduct.image" alt="{{ selectedProduct.title }}" class="modal-image">
    <h2>{{ selectedProduct.title }}</h2>
    <p>{{ selectedProduct.tooltip }}</p>
  </div>
</div>
