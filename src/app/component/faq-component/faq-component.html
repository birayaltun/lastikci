<ul class="faq">
  @for (item of items; track item.q; let i = $index) {
    <li class="faq__item" [class.is-open]="openIndex === i">
      <h3 class="faq__q">
        <button
          type="button"
          class="faq__trigger"
          [attr.aria-expanded]="openIndex === i"
          (click)="toggle(i)"
        >
          <span>{{ item.q }}</span>
          <i class="fa-solid fa-chevron-down faq__chevron" aria-hidden="true"></i>
        </button>
      </h3>
      <div class="faq__panel">
        <p>{{ item.a }}</p>
      </div>
    </li>
  }
</ul>
